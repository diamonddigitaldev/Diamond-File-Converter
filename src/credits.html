<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond File Converter | Credits</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../node_modules/material-icons/iconfont/round.css">
    <script>
        (() => {
            const mql = window.matchMedia("(prefers-color-scheme: dark)");
            const root = document.documentElement;
            const apply = () => root.setAttribute("data-bs-theme", mql.matches ? "dark" : "light");
            apply();
            mql.addEventListener?.("change", apply);
        })();
    </script>
</head>

<body class="popup-window">
    <div>
        <div>
            <div style="display:flex;">
                <img id="credits-logo" src="./assets/diamondfileconverter.png" alt="Diamond File Converter Logo">
            <h2>Diamond File Converter</h2>
            </div>
            <p>• Created and maintained by <span data-href="https://diamonddigital.dev">Diamond Digital Development</span>.</p>
            <p>• Logo designed by <span data-href="https://github.com/TheFuturisticIdiot">TheFuturisticIdiot</span>.</p>
            <p>• This software is licensed under the Apache 2.0 license.</p>
            <hr>
            <p>• If you enjoy this software, consider donating to support development!</p>
            <div>
                <button id="donate" class="btn">Donate on Buy Me a Coffee</button>
                <button id="github" class="btn">View Source Code on GitHub</button>
            </div>
        </div>
    </div>

    <script>
        // This page runs with contextIsolation on, so there is no `shell` and
        // no require() here. Links go out through the preload bridge, and the
        // inline onclick handlers v1 used are replaced by data-href.
        const api = window.electronAPI;

        api.getVersion().then((version) => {
            document.querySelector("h2").innerText += ` v${version}`;
        });

        for (const el of document.querySelectorAll("span[data-href]")) {
            el.addEventListener("click", () => api.openExternal(el.dataset.href));
        }

        document.getElementById("donate").addEventListener("click", () => {
            api.openExternal("https://buymeacoff.ee/willtda");
        });

        document.getElementById("github").addEventListener("click", () => {
            api.openExternal("https://github.com/diamonddigitaldev/Diamond-File-Converter");
        });

        // Escape-to-close lives in the main process (before-input-event in
        // createCreditsWindow), not here. A page-level keydown listener depends
        // on this script having run and on focus being inside the document, and
        // it did not work in the packaged build.
    </script>
</body>

</html>
