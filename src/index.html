<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond File Converter</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/material-icons/iconfont/round.css">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        (() => {
            const mql = window.matchMedia("(prefers-color-scheme: dark)");
            const apply = () => document.documentElement.setAttribute("data-bs-theme", mql.matches ? "dark" : "light");
            apply();
            mql.addEventListener("change", apply);
        })();
    </script>
</head>
<body>

    <div class="app-shell">

        <header class="app-header">
            <h1 class="app-title">Diamond File Converter</h1>
            <div class="d-flex gap-2 align-items-center">
                <button id="btn-add-files" class="btn btn-sm btn-secondary d-inline-flex align-items-center gap-1">
                    <span class="material-icons-round" style="font-size:16px">note_add</span>Add Files
                </button>
                <button id="btn-add-folder" class="btn btn-sm btn-secondary d-inline-flex align-items-center gap-1">
                    <span class="material-icons-round" style="font-size:16px">create_new_folder</span>Add Folder
                </button>
                <button id="btn-new-job" class="btn btn-sm btn-primary d-inline-flex align-items-center gap-1" disabled>
                    <span class="material-icons-round" style="font-size:16px">tune</span>New Job
                </button>
            </div>
        </header>

        <!-- Empty state: the full drop target -->
        <div id="empty-state" class="empty-state">
            <div id="drop-zone" class="drop-zone">
                <span class="material-icons-round drop-icon">upload_file</span>
                <p class="drop-label mb-1">Drag &amp; Drop Files or Folders Here</p>
                <p class="text-secondary small mb-2">or</p>
                <button id="browse-btn" class="btn btn-sm btn-secondary">Select Files</button>
            </div>
        </div>

        <!-- Bulk edit bar, shown when a selection exists -->
        <div id="bulk-bar" class="bulk-bar d-none">
            <input type="checkbox" id="bulk-select-all" class="form-check-input card-select" title="Select all">
            <span id="bulk-count" class="fw-semibold"></span>
            <div class="bulk-sep"></div>
            <label class="small text-secondary" for="bulk-target" id="bulk-target-label">Convert all to</label>
            <select id="bulk-target" class="form-select form-select-sm bulk-select"></select>
            <span id="bulk-target-note" class="small text-secondary"></span>
            <div class="ms-auto d-flex gap-2">
                <button id="bulk-remove" class="btn btn-sm btn-outline-danger">Remove</button>
                <button id="bulk-deselect" class="btn btn-sm btn-outline-secondary d-none">Deselect</button>
            </div>
        </div>

        <!-- The grid -->
        <main id="grid-scroll" class="grid-scroll d-none">
            <div id="job-grid" class="job-grid"></div>
        </main>

        <!-- Footer action bar -->
        <footer id="action-bar" class="action-bar d-none">
            <div class="action-status">
                <div class="d-flex justify-content-between align-items-baseline mb-1">
                    <span id="queue-summary" class="small"></span>
                    <span id="queue-detail" class="small text-secondary"></span>
                </div>
                <div class="progress" style="height:6px">
                    <div id="overall-bar" class="progress-bar" style="width:0%"></div>
                </div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button id="btn-clear-all" class="btn btn-outline-secondary">Clear All</button>
                <button id="btn-cancel-all" class="btn btn-danger d-none">Cancel</button>
                <button id="btn-convert" class="btn btn-primary" disabled>Convert</button>
            </div>
        </footer>

    </div>

    <!-- New Job dialog. In-page Bootstrap modal per the house pattern: border-0
         header and footer, centred, icon + title in a flex row, neutral cancel
         and semantic confirm. Every control is built from the target format's
         capabilities, so an invalid combination cannot be selected. -->
    <div class="modal fade" id="job-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

          <div class="modal-header border-0 pb-2">
            <h5 class="modal-title d-flex align-items-center gap-2">
              <span class="material-icons-round accent">tune</span>
              New Job
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body pt-0">
            <p id="jm-scope" class="text-body-secondary small mb-3"></p>

            <div class="jm-row">
              <label class="form-label" for="jm-preset">Preset</label>
              <div class="input-group input-group-sm">
                <select id="jm-preset" class="form-select"></select>
                <button id="jm-preset-save" class="btn btn-outline-secondary" type="button">Save as&hellip;</button>
                <button id="jm-preset-delete" class="btn btn-outline-danger" type="button">Delete</button>
              </div>
              <div class="form-text">Presets store everything below except the files.</div>
            </div>

            <hr class="my-3">

            <div class="jm-row">
              <label class="form-label" for="jm-target">Convert to</label>
              <select id="jm-target" class="form-select form-select-sm"></select>
              <div id="jm-target-note" class="form-text"></div>
            </div>

            <h6 class="jm-section">Output</h6>
            <div class="jm-grid">
              <div class="jm-row">
                <label class="form-label" for="jm-routing">Destination</label>
                <select id="jm-routing" class="form-select form-select-sm">
                  <option value="alongside">Next to each source file</option>
                  <option value="fixed">A folder I choose</option>
                  <option value="mirror">Mirror the source folders</option>
                </select>
              </div>
              <div class="jm-row">
                <label class="form-label" for="jm-outdir">Folder</label>
                <div class="input-group input-group-sm">
                  <input id="jm-outdir" class="form-control" placeholder="Not set" readonly>
                  <button id="jm-outdir-browse" class="btn btn-outline-secondary" type="button">Browse</button>
                </div>
              </div>
              <div class="jm-row">
                <label class="form-label" for="jm-name">Name template</label>
                <input id="jm-name" class="form-control form-control-sm" placeholder="{name}">
                <div class="form-text">{name} {ext} {src} {index} {date}</div>
              </div>
              <div class="jm-row">
                <label class="form-label" for="jm-conflict">If it already exists</label>
                <select id="jm-conflict" class="form-select form-select-sm">
                  <option value="ask">Ask me</option>
                  <option value="unique">Save as a new file</option>
                  <option value="overwrite">Overwrite</option>
                  <option value="skip">Skip the file</option>
                </select>
              </div>
            </div>

            <div id="jm-video-section">
              <h6 class="jm-section">Video</h6>
              <div class="jm-grid">
                <div class="jm-row">
                  <label class="form-label" for="jm-vmode">Stream</label>
                  <select id="jm-vmode" class="form-select form-select-sm"></select>
                </div>
                <div class="jm-row jm-vencode">
                  <label class="form-label" for="jm-vcodec">Codec</label>
                  <select id="jm-vcodec" class="form-select form-select-sm"></select>
                </div>
                <div class="jm-row jm-vencode">
                  <label class="form-label" for="jm-quality-mode">Quality</label>
                  <div class="input-group input-group-sm">
                    <select id="jm-quality-mode" class="form-select" style="max-width:9rem">
                      <option value="crf">Constant quality</option>
                      <option value="bitrate">Target bitrate</option>
                    </select>
                    <input id="jm-crf" class="form-control" type="number" min="0" max="63" placeholder="auto">
                    <input id="jm-vbitrate" class="form-control d-none" type="number" min="1" placeholder="auto">
                    <span id="jm-vbitrate-unit" class="input-group-text d-none">kbps</span>
                  </div>
                  <div id="jm-crf-note" class="form-text"></div>
                </div>
                <div class="jm-row jm-vencode">
                  <label class="form-label" for="jm-encpreset">Encoder preset</label>
                  <select id="jm-encpreset" class="form-select form-select-sm"></select>
                </div>
                <div class="jm-row jm-vencode">
                  <label class="form-label" for="jm-width">Resize</label>
                  <div class="input-group input-group-sm">
                    <input id="jm-width" class="form-control" type="number" min="1" placeholder="auto">
                    <span class="input-group-text">&times;</span>
                    <input id="jm-height" class="form-control" type="number" min="1" placeholder="auto">
                    <select id="jm-fit" class="form-select" style="max-width:8rem">
                      <option value="contain">Contain</option>
                      <option value="cover">Cover</option>
                      <option value="stretch">Stretch</option>
                    </select>
                  </div>
                </div>
                <div class="jm-row jm-vencode">
                  <label class="form-label" for="jm-fps">Frame rate</label>
                  <input id="jm-fps" class="form-control form-control-sm" type="number" min="1" placeholder="source">
                </div>
              </div>
            </div>

            <div id="jm-audio-section">
              <h6 class="jm-section">Audio</h6>
              <div class="jm-grid">
                <div class="jm-row">
                  <label class="form-label" for="jm-amode">Stream</label>
                  <select id="jm-amode" class="form-select form-select-sm"></select>
                </div>
                <div class="jm-row jm-aencode">
                  <label class="form-label" for="jm-acodec">Codec</label>
                  <select id="jm-acodec" class="form-select form-select-sm"></select>
                </div>
                <div class="jm-row jm-aencode">
                  <label class="form-label" for="jm-abitrate">Bitrate</label>
                  <div class="input-group input-group-sm">
                    <input id="jm-abitrate" class="form-control" type="number" min="1" placeholder="auto">
                    <span class="input-group-text">kbps</span>
                  </div>
                </div>
                <div class="jm-row jm-aencode">
                  <label class="form-label" for="jm-arate">Sample rate</label>
                  <select id="jm-arate" class="form-select form-select-sm">
                    <option value="">Source</option>
                    <option value="44100">44.1 kHz</option>
                    <option value="48000">48 kHz</option>
                    <option value="96000">96 kHz</option>
                  </select>
                </div>
                <div class="jm-row jm-aencode">
                  <label class="form-label" for="jm-achannels">Channels</label>
                  <select id="jm-achannels" class="form-select form-select-sm">
                    <option value="">Source</option>
                    <option value="1">Mono</option>
                    <option value="2">Stereo</option>
                  </select>
                </div>
              </div>
            </div>

            <div id="jm-image-section">
              <h6 class="jm-section">Image</h6>
              <div class="jm-row">
                <label class="form-label" for="jm-iquality">Quality</label>
                <div class="d-flex align-items-center gap-2">
                  <input id="jm-iquality" class="form-range" type="range">
                  <span id="jm-iquality-value" class="small text-body-secondary" style="min-width:3.5rem"></span>
                </div>
                <div id="jm-iquality-note" class="form-text"></div>
              </div>
            </div>

            <div id="jm-trim-section">
              <h6 class="jm-section">Trim</h6>
              <div class="jm-grid">
                <div class="jm-row">
                  <label class="form-label" for="jm-trim-start">Start</label>
                  <input id="jm-trim-start" class="form-control form-control-sm" placeholder="0:00">
                </div>
                <div class="jm-row">
                  <label class="form-label" for="jm-trim-end">End</label>
                  <input id="jm-trim-end" class="form-control form-control-sm" placeholder="end">
                </div>
              </div>
              <div class="form-text">Seconds, or m:ss / h:mm:ss.</div>
            </div>

            <h6 class="jm-section">Command preview</h6>
            <pre id="jm-preview" class="jm-preview"></pre>
            <div id="jm-errors" class="form-text text-danger"></div>
          </div>

          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="jm-apply">Apply</button>
          </div>

        </div>
      </div>
    </div>

    <div id="toast-host" class="toast-host" aria-live="polite"></div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <!-- display.js is dual-loaded: required by tests in Node, loaded here as a
         plain script. It must come before renderer.js, which reads it off the
         global. -->
    <script src="core/display.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
