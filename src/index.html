<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond File Converter</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/material-icons/iconfont/round.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        (() => {
            const mql = window.matchMedia("(prefers-color-scheme: dark)");
            const apply = () => document.documentElement.setAttribute("data-bs-theme", mql.matches ? "dark" : "light");
            apply();
            mql.addEventListener("change", apply);
        })();
    </script>
</head>
<body class="p-4">

    <div class="container">

        <div class="mx-auto" style="max-width:580px">

        <h3 class="mb-4">Diamond File Converter</h3>

        <div id="drop-zone" class="drop-zone text-center mb-3">
            <div id="dz-empty">
                <span class="material-icons-round drop-icon">upload_file</span>
                <p class="drop-label mb-2">Drop files here or click to browse</p>
                <button id="browse-btn" class="btn btn-sm btn-secondary">Browse</button>
            </div>
            <div id="dz-has-files" class="d-none">
                <span class="material-icons-round text-secondary" style="font-size:28px">add_circle_outline</span>
                <p class="drop-label small mb-2"><span id="dz-file-count"></span> — drop more or browse</p>
                <div class="d-flex gap-2 justify-content-center">
                    <button id="browse-more-btn" class="btn btn-sm btn-secondary">Browse</button>
                    <button id="btn-clear-all" class="btn btn-sm btn-outline-secondary">Clear All</button>
                </div>
            </div>
        </div>

        <div id="file-list-section" class="d-none mb-3">
            <div id="file-list"></div>
        </div>

        <div id="format-section" class="d-none mb-3 text-center">
            <p class="text-secondary small mb-2">Convert to:</p>
            <div id="format-grid"></div>
        </div>

        <div id="action-convert" class="d-none mb-3">
            <button id="btn-start-convert" class="btn btn-primary w-100" disabled>Convert</button>
        </div>

        <div id="action-progress" class="d-none mb-3">
            <p class="small fw-semibold mb-1 text-truncate" id="progress-current-file"></p>
            <div class="progress mb-2" style="height:8px">
                <div id="progress-bar-fill" class="progress-bar" style="width:0%"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <span class="text-secondary small">
                    <span class="material-icons-round converting-spin me-1" style="font-size:15px;vertical-align:middle">sync</span>
                    <span id="progress-status">Converting...</span>
                </span>
                <span id="progress-label" class="text-secondary small">0%</span>
            </div>
            <button id="btn-cancel" class="btn btn-sm btn-outline-secondary mt-2">Cancel</button>
        </div>

        <div id="action-done" class="d-none mb-3">
            <div class="done-card p-3 rounded">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="material-icons-round text-success">check_circle</span>
                    <span class="fw-semibold" id="done-summary"></span>
                </div>
                <div id="done-file-list" class="mb-3"></div>
                <div id="done-folder-btns" class="d-flex flex-wrap gap-2 mb-2"></div>
                <button id="btn-convert-another" class="btn btn-sm btn-outline-secondary">Convert More Files</button>
            </div>
        </div>

        </div>

    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
